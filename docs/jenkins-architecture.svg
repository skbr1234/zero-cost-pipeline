<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300">
  <style>
    .box {
      rx: 18;
      ry: 18;
      stroke: #1f2933;
      stroke-width: 2;
    }
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 600;
      fill: #111827;
      text-anchor: middle;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      fill: #374151;
      text-anchor: middle;
    }
    .label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      fill: #4b5563;
      text-anchor: middle;
    }
    .icon-circle {
      stroke: #111827;
      stroke-width: 1.5;
    }
    .icon-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #111827;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .arrow {
      stroke: #111827;
      stroke-width: 2.2;
      fill: none;
      marker-end: url(#arrowhead);
    }
  </style>

  <!-- arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827" />
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1100" height="300" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="550" y="36"
        class="title">
    Zero-Cost CI/CD with Jenkins & Render
  </text>
  <text x="550" y="60"
        class="subtitle">
    GitHub → Jenkins (local runner) → Build & Test → Render Deploy Hook
  </text>

  <!-- GITHUB BOX -->
  <rect x="40" y="100" width="230" height="140"
        class="box" fill="#DBEAFE"/>
  <!-- GitHub "logo" style icon -->
  <circle cx="85" cy="135" r="18"
          class="icon-circle" fill="#1f2937"/>
  <text x="85" y="135" class="icon-text" fill="#F9FAFB">GH</text>
  <text x="180" y="135" class="subtitle">GitHub Repository</text>
  <text x="180" y="160" class="label">Branch: jenkins-demo</text>
  <text x="180" y="185" class="label">Source for Jenkinsfile & code</text>

  <!-- JENKINS BOX -->
  <rect x="310" y="100" width="260" height="140"
        class="box" fill="#FEF3C7"/>
  <!-- Jenkins-style icon -->
  <circle cx="345" cy="135" r="18"
          class="icon-circle" fill="#F97316"/>
  <text x="345" y="135" class="icon-text" fill="#111827">J</text>
  <text x="440" y="130" class="subtitle">Jenkins Pipeline</text>
  <text x="440" y="155" class="label">Runs on local machine</text>
  <text x="440" y="180" class="label">Avoids hosted CI / infra cost</text>

  <!-- BUILD & TEST BOX -->
  <rect x="610" y="100" width="210" height="140"
        class="box" fill="#DCFCE7"/>
  <!-- Test-tube style icon -->
  <circle cx="645" cy="135" r="18"
          class="icon-circle" fill="#16A34A"/>
  <text x="645" y="135" class="icon-text" fill="#ECFDF5">T</text>
  <text x="710" y="130" class="subtitle">Build & Test</text>
  <text x="710" y="155" class="label">Python virtualenv + pip</text>
  <text x="710" y="180" class="label">Automated tests with PyTest</text>

  <!-- RENDER BOX -->
  <rect x="850" y="100" width="210" height="140"
        class="box" fill="#FCE7F3"/>
  <!-- Rocket-style icon -->
  <circle cx="885" cy="135" r="18"
          class="icon-circle" fill="#EC4899"/>
  <text x="885" y="135" class="icon-text" fill="#FDF2F8">R</text>
  <text x="955" y="130" class="subtitle">Render Deployment</text>
  <text x="955" y="155" class="label">Deploy Hook endpoint</text>
  <text x="955" y="180" class="label">Triggered by Jenkins on success</text>

  <!-- ARROWS -->
  <line x1="270" y1="170" x2="310" y2="170" class="arrow"/>
  <line x1="570" y1="170" x2="610" y2="170" class="arrow"/>
  <line x1="820" y1="170" x2="850" y2="170" class="arrow"/>

  <!-- FOOTER NOTE -->
  <text x="550" y="265" class="label">
    Jenkins polls or receives webhooks from GitHub, runs tests locally, and triggers Render via a secure deploy hook.
  </text>
</svg>
